name: Backend CI/CD (AWS ECR & ECS Fargate)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, bcmath, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer Dependencies
        run: |
          cd backend
          composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run PHPUnit Tests
        run: |
          cd backend
          cp .env.example .env
          php artisan key:generate
          DB_CONNECTION=sqlite DB_DATABASE=:memory: php artisan test

      - name: Configure AWS Credentials (OIDC)
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Configure AWS Credentials (Access Keys)
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: devfolio-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd backend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend/ecs-task-def.json
          container-name: backend
          image: ${{ steps.build-image.outputs.image }}
          environment-variables: |
            APP_KEY=${{ secrets.APP_KEY }}
            APP_URL=${{ secrets.APP_URL }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            FILESYSTEM_DISK=${{ secrets.FILESYSTEM_DISK }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_BUCKET=${{ secrets.AWS_BUCKET }}
            AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }}
            GITHUB_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}
            GITHUB_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}
            GITHUB_REDIRECT_URI=${{ secrets.GH_REDIRECT_URI }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}
            ALLOWED_ORIGINS=https://devfolio.app.br,https://api.devfolio.app.br
            SANCTUM_STATEFUL_DOMAINS=devfolio.app.br,api.devfolio.app.br
            SESSION_DOMAIN=.devfolio.app.br
            SESSION_SECURE_COOKIE=true

      - name: Deploy Amazon ECS task definition
        id: deploy-task
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: devfolio-backend-service
          cluster: devfolio-cluster
          wait-for-service-stability: true

      - name: Get ECS Task Public IP
        id: get-ip
        run: |
          # 1. Obter o ARN da Task ativa
          TASK_ARN=$(aws ecs list-tasks --cluster devfolio-cluster --service devfolio-backend-service --desired-status RUNNING --query 'taskArns[0]' --output text)
          echo "Task ARN: $TASK_ARN"
          
          # 2. Obter o ID da interface de rede (ENI) anexada à Task
          ENI_ID=$(aws ecs describe-tasks --cluster devfolio-cluster --tasks $TASK_ARN --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" --output text)
          echo "ENI ID: $ENI_ID"
          
          # 3. Obter o IP público da ENI
          PUBLIC_IP=$(aws ec2 describe-network-interfaces --network-interface-ids $ENI_ID --query "NetworkInterfaces[0].Association.PublicIp" --output text)
          echo "Public IP: $PUBLIC_IP"
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

      - name: Update Cloudflare DNS with new Public IP
        run: |
          ZONE_ID="${{ secrets.CLOUDFLARE_ZONE_ID }}"
          API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          PUBLIC_IP="${{ steps.get-ip.outputs.public_ip }}"
          RECORD_NAME="api.devfolio.app.br"
          
          echo "Buscando o ID do registro DNS para $RECORD_NAME..."
          RESPONSE=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$RECORD_NAME" \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json")
            
          RECORD_ID=$(echo "$RESPONSE" | jq -r '.result[0].id')
          echo "Record ID encontrado: $RECORD_ID"
          
          if [ "$RECORD_ID" != "null" ] && [ -n "$RECORD_ID" ]; then
            echo "Atualizando o registro DNS para o IP $PUBLIC_IP..."
            curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
              -H "Authorization: Bearer $API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"A\",\"name\":\"api\",\"content\":\"$PUBLIC_IP\",\"ttl\":120,\"proxied\":true}"
            echo "DNS atualizado com sucesso!"
          else
            echo "----------------------------------------"
            echo "ERRO: Registro DNS não encontrado ou falha na API da Cloudflare!"
            echo "Resposta bruta da API da Cloudflare:"
            echo "$RESPONSE" | jq .
            echo "----------------------------------------"
            exit 1
          fi
